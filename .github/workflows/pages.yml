name: Publicar portal de Física
on:
  push:
    branches: [main]
    paths: ['apoio/**', 'FisicaEx01/**', 'FisicaEx02/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar cálculos da Calculadora de gráficos
        run: node --test apoio/programa-graficos/tests/data.test.cjs
      - name: Verificar calculadora de tabelas
        run: node --test apoio/calculadora-fisica/engine.test.cjs
      - name: Montar portal e conferir links
        run: node apoio/portal/build.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
